version: 2

sources: 
  - name: globalmart
    description: a clone of the snowflake database
    database: raw
    schema: globalmart
    tables: 
      - name: customers
      - name: orders
        description: details about orders
        columns:
          - name: orderid
            description: primary key for orders
            tests:
              - unique 
              - not_null 
      - name: product
